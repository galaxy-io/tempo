version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tempo
    main: ./cmd/tempo
    binary: tempo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/galaxy-io/tempo/internal/update.Version={{.Version}}
      - -X github.com/galaxy-io/tempo/internal/update.Commit={{.Commit}}
      - -X github.com/galaxy-io/tempo/internal/update.BuildDate={{.Date}}

archives:
  - id: tempo
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: galaxy-io
    name: tempo
  target_commitish: "{{ .Commit }}"
  draft: false
  prerelease: auto

homebrew_casks:
  - name: tempo
    repository:
      owner: galaxy-io
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      name: gx-null[bot]
      email: 286761379+gx-null[bot]@users.noreply.github.com
    homepage: "https://github.com/galaxy-io/tempo"
    description: "Keyboard-driven terminal client for inspecting and controlling Temporal workflows"
    binaries:
      - tempo
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tempo"]
          end
